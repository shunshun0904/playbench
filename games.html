<main>
<section class="sheet">
  <div class="band">
    <h2 class="band__t" data-en="Board games">盤上の自主研究</h2>
    <span class="band__n"></span>
    <span class="tag" id="games-count"></span>
  </div>
  <p class="lead" data-en="I like board games, so I rebuilt three of them to run in a browser and spent rather longer building their opponents. What follows is mostly a record of that. If you want a game, the CPU will play you — it is not there to lose politely.">
    ボードゲームが好きなので、3作をブラウザで動くように書き直し、
    そのあと相手のCPUのほうに長く時間を使いました。以下はおおむねその記録です。
    遊びたい方は、そのまま対戦できます。相手は手加減しません。
  </p>
  <div class="works" id="works"></div>
</section>

<section class="sheet" id="me">
  <div class="band">
    <h2 class="band__t band__t--sub" data-en="Your record">対戦の記録</h2>
    <span class="band__n"></span>
  </div>
  <div id="account-panel"></div>
</section>

<section class="sheet">
  <div class="band">
    <h2 class="band__t band__t--sub" data-en="What I want to try next">次に試したいこと</h2>
    <span class="band__n"></span>
  </div>
  <p class="lead" data-en="The opponent I actually want is not the strongest one — it is the one that has watched me play. Four steps. <strong>None of it is built</strong>; this is a note to myself.">
    ほしいのは最強の相手ではなく、<strong>自分の打ち方を見てきた相手</strong>です。順に4段階。
    <strong>まだどれも実装していません</strong>。自分用の覚え書きです。
  </p>
  <div id="plan"></div>
</section>

<section class="sheet">
  <div class="band">

  <div id="tenets"></div>
</section>

<!-- ══════════════════════════════════════════════ ログイン／新規登録 -->
<dialog class="modal" id="auth-modal" aria-labelledby="auth-title">
  <form class="modal__in" id="auth-form" method="dialog" novalidate>
    <div class="modal__head">
      <h2 class="modal__t" id="auth-title">ログイン</h2>
      <button class="modal__x" type="button" id="auth-close" aria-label="閉じる">×</button>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-tab="signin" data-en="Sign in">ログイン</button>
      <button class="tab" type="button" role="tab" data-tab="signup" data-en="Create account">新規登録</button>
    </div>

    <div class="field" data-field="email">
      <label class="field__k" for="f-email" data-en="Email">メールアドレス</label>
      <input class="field__i" id="f-email" name="email" type="email"
             autocomplete="email" autocapitalize="none" spellcheck="false">
      <p class="field__note" data-en="Used to sign in. It is never shown to anyone else.">ログインに使います。他の人には見えません</p>
    </div>

    <div class="field" data-field="handle">
      <label class="field__k" for="f-handle" data-en="Handle">ハンドル名</label>
      <div class="field__wrap">
        <span class="field__at">@</span>
        <input class="field__i field__i--at" id="f-handle" name="handle" type="text"
               autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <p class="field__note" data-en="Lower-case letters, digits and _ — 3 to 20 characters.">半角の英小文字・数字・_ で 3〜20 文字</p>
    </div>

    <div class="field" data-field="display">
      <label class="field__k" for="f-display" data-en="Display name">表示名</label>
      <input class="field__i" id="f-display" name="display" type="text" autocomplete="nickname" maxlength="24">
      <p class="field__note" data-en="Shown on the board and the ranking. Japanese is fine.">盤面やランキングに出る名前。日本語で構いません</p>
    </div>

    <div class="field" data-field="pass">
      <label class="field__k" for="f-pass" data-en="Password">パスワード</label>
      <input class="field__i" id="f-pass" name="pass" type="password" minlength="8">
      <p class="field__note" data-en="8 characters or more.">8文字以上</p>
    </div>

    <p class="modal__err" id="auth-err" role="alert" hidden></p>

    <button class="btn btn--go btn--wide" type="submit" id="auth-submit">ログイン</button>

    <p class="modal__foot" id="auth-foot"></p>
  </form>
</dialog>
