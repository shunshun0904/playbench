/* ==========================================================================
   PLAYBENCH ─ 白い紙に刷る

   地は白か黒。灰も色味を持たせず、無彩色でそろえる。
   もとは製図用紙と青焼き（生成りの地に方眼、藍の地に白抜き）だったが、
   罫が字の下を走って読みにくかったので、地は無地にした。

   色を持つのは2つだけ。役割があるものにしか使わない。
     朱  ── 押せるもの、いま言いたい一行、互角を超えた棒
     藍  ── 比較のための計測値
   数値はすべて等幅・桁揃えで、互角の線と一緒に読む。
   ========================================================================== */

/* --------------------------------------------------------------- tokens */
/* 既定は黒。素の :root が暗い地で、白は選んだときだけ。
   端末の設定（prefers-color-scheme）は見ない ── 見ていると、
   明るい設定の人には白で出てしまい「既定は黒」にならない。
   選んだ結果は localStorage に残るので、白にした人は白のまま。 */
:root {
  --paper:        #000000;
  --sheet:        #0e0e0e;
  --ink:          #f2f2f2;
  --ink-mid:      #b5b5b5;
  --ink-mute:     #8c8c8c;
  --rule:         #303030;
  --rule-soft:    #1d1d1d;
  --vermilion:    #e8815f;
  --vermilion-dim:rgba(232, 129, 95, .16);
  --indigo:       #82b4da;
  --bar-cmp:      rgba(130, 180, 218, .30);
  --bar-lead:     rgba(232, 129, 95, .34);
  --danger:       #e0715a;
  --scrim:        rgba(0, 0, 0, .70);
  --shadow:       0 1px 0 rgba(0, 0, 0, .3);
  --lift:         0 14px 46px rgba(0, 0, 0, .55);

  --serif: "Hiragino Mincho ProN", "HiraMinProN-W3", "Yu Mincho", YuMincho,
           "Noto Serif JP", "Songti SC", "Source Han Serif", serif;
  --mono:  ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo,
           Consolas, "Noto Sans Mono", monospace;

  --measure: 36rem;
  --sheet-w: 64rem;

  --s1: .35rem;  --s2: .7rem;   --s3: 1.1rem;  --s4: 1.7rem;
  --s5: 2.6rem;  --s6: 4rem;    --s7: 6rem;
}

/* 白は明示的に選んだときだけ。素の :root より詳細度が高いので勝つ */
:root[data-theme="light"] {
  --paper:        #ffffff;
  --sheet:        #fafafa;
  --ink:          #141414;
  --ink-mid:      #4a4a4a;
  --ink-mute:     #767676;
  --rule:         #d6d6d6;
  --rule-soft:    #e8e8e8;
  --vermilion:    #b03a24;
  --vermilion-dim:rgba(176, 58, 36, .13);
  --indigo:       #2b4c6f;
  --bar-cmp:      rgba(43, 76, 111, .30);
  --bar-lead:     rgba(176, 58, 36, .34);
  --danger:       #8c2f1c;
  --scrim:        rgba(0, 0, 0, .45);
  --shadow:       0 1px 0 rgba(0, 0, 0, .06);
  --lift:         0 12px 40px rgba(0, 0, 0, .18);
}

/* ----------------------------------------------------------------- base */
*, *::before, *::after { box-sizing: border-box; }

html { background-color: var(--paper); scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

/* 背景は無地。方眼の罫を敷いていたが、字の下に線が走って読みにくかった。
   紙の質感は罫ではなく、余白と区切り線1本で出す。 */
body {
  margin: 0;
  color: var(--ink);
  background-color: var(--paper);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: var(--vermilion-dim); }
a { color: inherit; }

/* hidden 属性は、display を持つクラスに負ける。ここで勝たせておく */
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--vermilion); outline-offset: 3px; }

.sheet { width: min(100% - 2.5rem, var(--sheet-w)); margin-inline: auto; }

/* ラベル */
.tag {
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}
.tag--ink { color: var(--ink-mid); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

/* 升目。罫は outline で引くので、最終行が埋まらなくても余りが抜けない */
.cells { display: grid; gap: 1px; background: var(--sheet); border: 1px solid var(--rule); }
.cells > * { outline: 1px solid var(--rule); }

/* --------------------------------------------------------------- ボタン */
.btn {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  font-family: var(--mono);
  font-size: .76rem;
  letter-spacing: .08em;
  padding: .55rem 1rem;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink-mid);
  text-decoration: none;
  cursor: pointer;
  border-radius: 0;
  transition: color .15s, border-color .15s, background .15s;
}
.btn:hover { color: var(--ink); border-color: var(--ink-mute); }

.btn--go {
  border-color: var(--vermilion);
  color: var(--vermilion);
  font-size: .82rem;
  padding: .62rem 1.3rem;
}
.btn--go:hover { background: var(--vermilion-dim); color: var(--vermilion); border-color: var(--vermilion); }

.btn--wide { width: 100%; justify-content: center; }
.btn--off { border-style: dashed; color: var(--ink-mute); cursor: not-allowed; }
.btn--off:hover { color: var(--ink-mute); border-color: var(--rule); }
.btn--danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--rule)); }
.btn--danger:hover { color: var(--danger); border-color: var(--danger); }
.btn[disabled] { opacity: .5; cursor: progress; }

/* --------------------------------------------------------------- 天 */
.masthead {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
}
.masthead__in {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding-block: .75rem;
}
/* 索引タブ。図面の袋に挿す耳のつもりで、いま開いている1枚だけ地の色を持つ */
.masthead__nav { display: flex; gap: .2rem; margin-right: auto; flex-wrap: wrap; }
.masthead__nav a {
  font-size: .84rem;
  color: var(--ink-mute);
  text-decoration: none;
  padding: .3rem .8rem;
  border: 1px solid transparent;
  white-space: nowrap;
}
.masthead__nav a:hover { color: var(--ink); border-color: var(--rule-soft); }
.masthead__nav a.is-here {
  color: var(--ink);
  background: var(--sheet);
  border-color: var(--rule);
  box-shadow: inset 0 2px 0 var(--vermilion);
}

.masthead__tools { display: flex; align-items: center; gap: .45rem; }

.ctl {
  font-family: var(--mono);
  font-size: .7rem;
  letter-spacing: .1em;
  color: var(--ink-mute);
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: .32rem .62rem;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  transition: color .15s, border-color .15s;
}
.ctl:hover { color: var(--ink); border-color: var(--ink-mute); }
.ctl--go { color: var(--vermilion); border-color: var(--vermilion); }
.ctl__on { color: var(--vermilion); }
.ctl__short { display: none; }

/* ログイン中の名前 */
.who {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  padding: .25rem .6rem .25rem .35rem;
  border: 1px solid var(--rule);
  text-decoration: none;
  color: var(--ink-mid);
  max-width: 12rem;
}
.who:hover { color: var(--ink); border-color: var(--ink-mute); }
.who__n { font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.idc { display: block; width: 1.15rem; height: 1.15rem; color: var(--indigo); flex: none; }

/* --------------------------------------------------------------- 表紙 */
.cover { padding-block: var(--s6) var(--s5); }

.cover__title {
  font-size: clamp(2.2rem, 6.4vw, 3.9rem);
  line-height: 1.3;
  font-weight: 500;
  margin: 0 0 var(--s3);
  letter-spacing: .02em;
  text-wrap: balance;
}
.cover__title em { font-style: normal; color: var(--vermilion); }

.cover__lead {
  max-width: var(--measure);
  font-size: 1rem;
  color: var(--ink-mid);
  margin: 0 0 var(--s4);
}
.cover__lead strong { font-weight: 600; color: var(--ink); }
.cover__lead em { font-style: normal; color: var(--vermilion); }

.cover__acts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); }
.cover__hint { font-size: .8rem; color: var(--ink-mute); }

/* --------------------------------------------------------------- 見出し */
.band {
  display: flex;
  align-items: baseline;
  gap: var(--s3);
  padding-top: var(--s6);
  padding-bottom: var(--s4);
}
.band__t { font-size: 1.4rem; font-weight: 500; margin: 0; letter-spacing: .04em; white-space: nowrap; }
.band__t--sub { font-size: 1.05rem; color: var(--ink-mid); }
.band__n { flex: 1; border-top: 1px solid var(--rule); }

/* --------------------------------------------------------------- ゲーム */
.works { display: flex; flex-direction: column; gap: var(--s4); }

.game { border: 1px solid var(--rule); background: var(--sheet); }

.game__top {
  display: grid;
  grid-template-columns: 9rem 1fr;
  gap: var(--s4);
  padding: var(--s4);
  align-items: start;
}

.game__fig { border: 1px solid var(--rule-soft); background: var(--sheet); }
.game__fig svg { width: 100%; height: auto; display: block; }

.game__head { min-width: 0; display: flex; flex-direction: column; gap: var(--s2); }

.game__title { font-size: 1.75rem; font-weight: 500; margin: 0; letter-spacing: .03em; line-height: 1.3; }

.game__meta { margin: 0; font-size: .82rem; color: var(--ink-mute); display: flex; flex-wrap: wrap; gap: .1rem .5rem; }
.game__dot { opacity: .5; }

.game__hook { margin: 0; color: var(--ink); max-width: var(--measure); }

/* 相手の強さ。一行の計器 */
.chip {
  display: grid;
  grid-template-columns: auto 7.5rem auto minmax(0, 1fr);
  align-items: center;
  gap: .55rem;
  padding: .5rem .7rem;
  border: 1px solid var(--rule-soft);
  background: color-mix(in srgb, var(--paper) 45%, var(--sheet));
  font-size: .74rem;
}
.chip__k { font-family: var(--mono); font-size: .64rem; letter-spacing: .12em; color: var(--ink-mute); white-space: nowrap; }
.chip__track { position: relative; height: .75rem; background: color-mix(in srgb, var(--paper) 80%, var(--sheet)); border: 1px solid var(--rule-soft); }
.chip__track::after {
  content: "";
  position: absolute;
  inset-block: -1px;
  left: var(--base, 25%);
  border-left: 1px dashed var(--ink);
  opacity: .55;
}
.chip__bar {
  position: absolute; inset-block: 0; left: 0;
  width: calc(var(--v) * 100%);
  background: var(--bar-lead);
  border-right: 2px solid var(--vermilion);
}
.chip__v { color: var(--vermilion); font-size: .82rem; }
.chip__n { color: var(--ink-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.game__acts { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin-top: .2rem; }
.game__opp { font-size: .74rem; color: var(--ink-mute); display: flex; gap: .4rem; align-items: baseline; }
.game__opp b { font-weight: 400; font-family: var(--mono); font-size: .62rem; letter-spacing: .12em; }

/* 畳んである「作りの話」 */
.game__more { border-top: 1px solid var(--rule); }
.game__sum {
  cursor: pointer;
  list-style: none;
  padding: .7rem var(--s4);
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .1em;
  color: var(--ink-mute);
  display: flex;
  align-items: center;
  gap: .5rem;
}
.game__sum::-webkit-details-marker { display: none; }
.game__sum::before { content: "＋"; color: var(--vermilion); }
.game__more[open] .game__sum::before { content: "−"; }
.game__sum:hover { color: var(--ink); }

.game__body { border: 0; border-top: 1px solid var(--rule); grid-template-columns: 1fr 1.1fr; }
.cell { background: var(--sheet); padding: var(--s4); }
.cell__k { display: block; margin-bottom: var(--s2); padding-bottom: var(--s2); border-bottom: 1px solid var(--rule-soft); }
.cell__t { font-size: 1rem; font-weight: 500; margin: 0 0 var(--s2); }
.cell__p { margin: 0; font-size: .85rem; color: var(--ink-mid); }
.cell__p--rm { margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--rule-soft); font-size: .8rem; }
.cell__p--rm b { color: var(--vermilion); font-family: var(--mono); font-size: .66rem; letter-spacing: .14em; font-weight: 400; }

/* --------------------------------------------------------- 実測プレート */
.plate { margin: 0; }
.plate__note { display: block; margin-top: .25rem; font-size: .72rem; color: var(--ink-mute); font-family: var(--mono); }

.scale {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: .42rem;
  --lab: 9.4rem;
  --val: 3.1rem;
  --cgap: .7rem;
  --base: .25;
  --axis-h: 1.45rem;
}

/* 互角の線 ── 全行を貫いて1本立つ */
.scale__base {
  position: absolute;
  top: -.15rem;
  height: calc(100% - var(--axis-h) + .3rem);
  left: calc(var(--lab) + var(--cgap)
        + (100% - var(--lab) - var(--val) - var(--cgap) * 2) * var(--base));
  width: 0;
  border-left: 1px dashed var(--ink);
  opacity: .5;
  pointer-events: none;
  z-index: 3;
}
.scale__base::before {
  content: "";
  position: absolute;
  top: -1px; left: -2.5px;
  border-left: 2.5px solid transparent;
  border-right: 2.5px solid transparent;
  border-top: 3.5px solid var(--ink);
}

.srow, .axis {
  display: grid;
  grid-template-columns: minmax(0, var(--lab)) 1fr var(--val);
  gap: var(--cgap);
  align-items: center;
}
.srow__l { font-size: .77rem; color: var(--ink-mute); line-height: 1.38; text-align: right; overflow-wrap: anywhere; }
.srow--lead .srow__l { color: var(--ink); }

.srow__track {
  position: relative;
  height: 1.1rem;
  background: color-mix(in srgb, var(--paper) 75%, var(--sheet));
  border: 1px solid var(--rule-soft);
}
.srow__bar {
  position: absolute; inset-block: 0; left: 0;
  width: calc(var(--v) * 100%);
  background: var(--bar-cmp);
  border-right: 2px solid var(--indigo);
}
.srow--lead .srow__bar { background: var(--bar-lead); border-right-color: var(--vermilion); }

.srow__v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .82rem; text-align: right; color: var(--ink-mid); }
.srow--lead .srow__v { color: var(--vermilion); font-size: .92rem; }

.axis { margin-top: .1rem; align-items: start; }
.axis__t { grid-column: 2; position: relative; height: var(--axis-h); }
.axis__tick {
  position: absolute;
  top: 0;
  font-family: var(--mono);
  font-size: .63rem;
  line-height: 1.4;
  color: var(--ink-mute);
  padding-top: .28rem;
  padding-left: .3rem;
  border-left: 1px solid var(--rule);
  white-space: nowrap;
}
.axis__tick--end { border-left: 0; border-right: 1px solid var(--rule); padding-left: 0; padding-right: .3rem; transform: translateX(-100%); }
.axis__tick--base { color: var(--ink-mid); border-left-style: dashed; border-left-color: var(--ink); }

/* ------------------------------------------------------------------ BGG */
/* 他人が付けた数字。こちらの実測（朱）と混ざらないよう、藍だけで組む。 */
.bgg {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .4rem 1rem;
  padding: .5rem .7rem;
  border: 1px solid var(--rule-soft);
  border-left: 2px solid var(--indigo);
  background: color-mix(in srgb, var(--paper) 30%, var(--sheet));
  font-size: .73rem;
}
.bgg__k {
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .16em;
  color: var(--indigo);
  white-space: nowrap;
}
.bgg__m { display: flex; align-items: center; gap: .45rem; }
.bgg__ml { color: var(--ink-mute); white-space: nowrap; }
.bgg__t {
  position: relative;
  width: 4.6rem;
  height: .5rem;
  background: color-mix(in srgb, var(--paper) 80%, var(--sheet));
  border: 1px solid var(--rule-soft);
}
.bgg__b { position: absolute; inset-block: 0; left: 0; background: var(--bar-cmp); border-right: 2px solid var(--indigo); }
.bgg__v { color: var(--ink-mid); white-space: nowrap; font-size: .73rem; }

.bgg__tail { display: flex; align-items: center; gap: .7rem; margin-left: auto; flex-wrap: wrap; }
.bgg__n, .bgg__d { color: var(--ink-mute); font-size: .66rem; white-space: nowrap; }
.bgg__a {
  color: var(--indigo);
  text-decoration-color: color-mix(in srgb, var(--indigo) 40%, transparent);
  text-underline-offset: .2em;
  white-space: nowrap;
}
.bgg__a:hover { text-decoration-color: var(--indigo); }

/* 信頼区間のひげ。棒の先がどれだけ揺れるかを示す */
.srow__err {
  position: absolute;
  top: 50%;
  height: 0;
  border-top: 1px solid var(--ink);
  opacity: .5;
  z-index: 2;
  pointer-events: none;
}
.srow__err::before, .srow__err::after {
  content: "";
  position: absolute;
  top: -3px;
  height: 7px;
  border-left: 1px solid var(--ink);
}
.srow__err::before { left: 0; }
.srow__err::after  { right: 0; }
.srow__ci { margin-left: .3rem; font-size: .62rem; color: var(--ink-mute); }

/* 確認リンクから戻ってきたときの知らせ */
.landing {
  display: flex;
  align-items: center;
  gap: var(--s2);
  width: min(100% - 2.5rem, var(--sheet-w));
  margin: var(--s3) auto 0;
  padding: .7rem var(--s3);
  border: 1px solid var(--indigo);
  border-left-width: 3px;
  background: color-mix(in srgb, var(--indigo) 8%, var(--sheet));
  font-size: .88rem;
}
.landing--bad { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--sheet)); }
.landing__t { flex: 1; }
.landing__x {
  background: transparent; border: 1px solid var(--rule); color: var(--ink-mute);
  cursor: pointer; padding: .1rem .45rem; line-height: 1; font-size: .95rem;
}
.landing__x:hover { color: var(--ink); border-color: var(--ink-mute); }

/* ------------------------------------------------------------ アカウント */
.invite {
  border: 1px solid var(--rule);
  background: var(--sheet);
  padding: var(--s4);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.invite__t { margin: 0; font-size: 1.15rem; font-weight: 500; }
.invite__b { margin: 0; color: var(--ink-mid); max-width: var(--measure); font-size: .92rem; }
.invite__acts { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s2); }

.me { border: 1px solid var(--rule); background: var(--sheet); }
.me__head {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s4);
  border-bottom: 1px solid var(--rule);
}
.me__head .idc { width: 2.6rem; height: 2.6rem; border: 1px solid var(--rule-soft); }
.me__who { margin-right: auto; min-width: 0; }
.me__n { margin: 0; font-size: 1.25rem; font-weight: 500; line-height: 1.4; }
.me__h { margin: 0; font-family: var(--mono); font-size: .75rem; color: var(--ink-mute); }
.me__where {
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .12em;
  color: var(--ink-mute);
  border: 1px solid var(--rule);
  padding: .15rem .5rem;
  white-space: nowrap;
}

.stats { border: 0; border-bottom: 1px solid var(--rule); grid-template-columns: repeat(auto-fit, minmax(min(9rem, 100%), 1fr)); }
.stat { background: var(--sheet); padding: var(--s3); display: flex; flex-direction: column; gap: .15rem; }
.stat__v { font-size: 1.7rem; line-height: 1.15; }
.stat__k { font-size: .78rem; color: var(--ink-mid); }
.stat__note { font-size: .68rem; color: var(--ink-mute); font-family: var(--mono); }

.me__empty { margin: 0; padding: var(--s3) var(--s4); color: var(--ink-mute); font-size: .85rem; border-bottom: 1px solid var(--rule); }

.me__form { padding: var(--s4); border-bottom: 1px solid var(--rule); }
.me__msg { margin: var(--s2) 0 0; font-size: .8rem; color: var(--ink-mute); }
.me__msg--bad { color: var(--danger); }

.me__foot { display: flex; flex-wrap: wrap; gap: var(--s2); padding: var(--s3) var(--s4); }

/* ------------------------------------------------------------ ランキング */
.rank { border: 1px solid var(--rule); background: var(--sheet); }
.rank__row {
  display: grid;
  grid-template-columns: 2.4rem 1fr 1fr 8rem 5rem 5rem;
  gap: var(--s2);
  padding: .6rem var(--s3);
  font-size: .78rem;
  align-items: center;
}
.rank__row--head {
  font-family: var(--mono);
  font-size: .64rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-mute);
  border-bottom: 1px solid var(--rule);
}
.rank__empty { padding: var(--s5) var(--s3); text-align: center; color: var(--ink-mute); font-size: .88rem; }
.rank__empty p { margin: 0; }

/* ------------------------------------------------------------- これから */
.plan { grid-template-columns: repeat(auto-fit, minmax(min(15rem, 100%), 1fr)); }
.step { background: var(--sheet); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
.step__n { font-size: 1.5rem; color: var(--vermilion); line-height: 1; }
.step__t { font-size: 1rem; font-weight: 500; margin: 0; }
.step__b { margin: 0; font-size: .84rem; color: var(--ink-mid); }
.step__note { margin: auto 0 0; padding-top: var(--s2); border-top: 1px solid var(--rule-soft); font-size: .74rem; color: var(--ink-mute); }
.step__state {
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .14em;
  color: var(--ink-mute);
  border: 1px solid var(--rule);
  padding: .1rem .45rem;
  align-self: flex-start;
}

.wire { margin-top: var(--s3); padding: var(--s4); border: 1px solid var(--rule); background: var(--sheet); overflow-x: auto; }
.wire svg { display: block; min-width: 40rem; width: 100%; height: auto; }

/* ------------------------------------------------------------- 作り */
.tenets { grid-template-columns: repeat(auto-fit, minmax(min(24rem, 100%), 1fr)); }
.tenet { background: var(--sheet); padding: var(--s4); }
.tenet__t { font-size: .95rem; font-weight: 500; margin: 0 0 var(--s2); padding-bottom: var(--s2); border-bottom: 1px solid var(--rule-soft); }
.tenet__b { margin: 0; font-size: .84rem; color: var(--ink-mid); }

/* ------------------------------------------------- ログイン／新規登録 */
.modal {
  border: 1px solid var(--rule);
  background: var(--sheet);
  color: var(--ink);
  padding: 0;
  width: min(100% - 2rem, 26rem);
  box-shadow: var(--lift);
}
.modal::backdrop { background: var(--scrim); backdrop-filter: blur(2px); }

.modal__in { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.modal__head { display: flex; align-items: center; gap: var(--s2); }
.modal__t { margin: 0; margin-right: auto; font-size: 1.2rem; font-weight: 500; }
.modal__x {
  background: transparent;
  border: 1px solid var(--rule);
  color: var(--ink-mute);
  font-size: 1rem;
  line-height: 1;
  padding: .2rem .5rem;
  cursor: pointer;
}
.modal__x:hover { color: var(--ink); border-color: var(--ink-mute); }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.tab {
  background: var(--sheet);
  border: 0;
  padding: .5rem;
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .08em;
  color: var(--ink-mute);
  cursor: pointer;
}
.tab--on { color: var(--vermilion); background: var(--vermilion-dim); }

.field { display: flex; flex-direction: column; gap: .3rem; }
.field--row { flex-direction: row; align-items: center; flex-wrap: wrap; gap: var(--s2); }
.field--row .field__i { flex: 1; min-width: 10rem; }
.field__k { font-family: var(--mono); font-size: .66rem; letter-spacing: .12em; color: var(--ink-mute); text-transform: uppercase; }
.field__wrap { display: flex; align-items: stretch; }
.field__at {
  display: flex; align-items: center;
  padding-inline: .55rem;
  border: 1px solid var(--rule); border-right: 0;
  font-family: var(--mono); font-size: .9rem; color: var(--ink-mute);
  background: color-mix(in srgb, var(--paper) 50%, var(--sheet));
}
.field__i {
  font-family: var(--mono);
  font-size: .95rem;
  padding: .55rem .65rem;
  border: 1px solid var(--rule);
  background: color-mix(in srgb, var(--paper) 30%, var(--sheet));
  color: var(--ink);
  border-radius: 0;
  width: 100%;
  min-width: 0;
}
.field__i:focus { outline: 2px solid var(--vermilion); outline-offset: -2px; border-color: var(--vermilion); }
.field__i--at { border-left: 0; }
.field__note { margin: 0; font-size: .72rem; color: var(--ink-mute); }

.modal__err {
  margin: 0;
  padding: .6rem .8rem;
  border: 1px solid var(--danger);
  background: color-mix(in srgb, var(--danger) 10%, transparent);
  color: var(--danger);
  font-size: .82rem;
}
.modal__foot { margin: 0; font-size: .74rem; color: var(--ink-mute); line-height: 1.7; }
.modal__foot strong { color: var(--ink-mid); font-weight: 600; }

/* --------------------------------------------------------------- 奥付 */
.colophon {
  margin-top: var(--s7);
  padding-block: var(--s5) var(--s6);
  border-top: 1px solid var(--rule);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(14rem, 100%), 1fr));
  gap: var(--s4);
  font-size: .8rem;
  color: var(--ink-mute);
}
.colophon__t { color: var(--ink-mid); margin: 0 0 var(--s2); font-size: .84rem; }
.colophon p { margin: 0 0 var(--s2); line-height: 1.75; }
.colophon a { color: var(--ink-mid); text-decoration-color: var(--rule); text-underline-offset: .2em; }
.colophon a:hover { color: var(--vermilion); }

/* いま計測しているか。朱く点いていれば送っている、という読み方にする */
.pstate { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .5rem; }
.pstate__d {
  width: .48rem; height: .48rem; flex: none;
  align-self: center;
  border: 1px solid var(--ink-mute);
}
.pstate--on .pstate__d { background: var(--vermilion); border-color: var(--vermilion); }

.lnk {
  font: inherit; color: var(--ink-mid);
  background: none; border: 0; padding: 0;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: var(--rule);
  text-underline-offset: .2em;
}
.lnk:hover { color: var(--vermilion); text-decoration-color: currentColor; }

/* --------------------------------------------------------------- 動き */
@media (prefers-reduced-motion: no-preference) {
  .srow__bar { width: 0; transition: width .8s cubic-bezier(.16, .84, .34, 1); }
  .is-read .srow__bar { width: calc(var(--v) * 100%); }
  .srow:nth-child(1) .srow__bar { transition-delay: .00s; }
  .srow:nth-child(2) .srow__bar { transition-delay: .07s; }
  .srow:nth-child(3) .srow__bar { transition-delay: .14s; }
  .srow:nth-child(4) .srow__bar { transition-delay: .21s; }
  .srow:nth-child(5) .srow__bar { transition-delay: .28s; }
}

/* --------------------------------------------------------------- 狭い幅 */
@media (max-width: 62rem) {
  .game__body { grid-template-columns: 1fr; }
  .rank__row { grid-template-columns: 2.2rem 1fr 6rem 4.5rem; }
  .rank__row > :nth-child(4) { display: none; }
}
@media (max-width: 46rem) {
  body { font-size: 15px; }
  /* タブはページの切り替えそのものなので、狭くても隠さない。
     （以前ここは同じページ内への links だったので畳んでいた）
     名乗りと切替ボタンを1行目、タブを2行目に落として、3枚で幅を分ける。 */
  .masthead__in { gap: .4rem; padding-block: .6rem; }
  .masthead__nav { gap: .15rem; flex-wrap: nowrap; min-width: 0; }
  .masthead__nav a { padding: .32rem .5rem; font-size: .78rem; }
  .ctl { padding: .32rem .5rem; }
  .ctl__now, .ctl__long { display: none; }
  .ctl__short { display: inline; }
  .who { max-width: 8rem; }
  .game__top { grid-template-columns: 1fr; gap: var(--s3); padding: var(--s3); }
  .game__fig { max-width: 8rem; }
  .game__sum, .cell, .me__head, .me__form, .invite { padding-inline: var(--s3); }
  .me__foot { padding-inline: var(--s3); }
  .chip { grid-template-columns: auto 1fr auto; }
  .bgg__tail { margin-left: 0; }
  .bgg__t { width: 3.4rem; }
  .chip__n { display: none; }
  .srow, .axis { grid-template-columns: minmax(0, 6.4rem) 1fr 2.6rem; }
  .scale { --lab: 6.4rem; --val: 2.6rem; }
  .srow__l { font-size: .7rem; }
  .cover { padding-block: var(--s5) var(--s4); }
  .band { padding-top: var(--s5); }
  .rank__row { grid-template-columns: 2rem 1fr 4.5rem; }
  .rank__row > :nth-child(3) { display: none; }
}

/* ══════════════════════════════════════════════════ 4ページ構成の追加分 */

/* 前置きの段落。以前の .cover__lead を、扉のない版として置き直したもの */
.lead {
  max-width: 46rem; margin: 0 0 var(--s4);
  font-size: 1rem; line-height: 1.95; color: var(--ink-mid);
}
.lead strong { color: var(--ink); font-weight: 600; }

/* ------------------------------------------------------------ トップ */
.hello { padding-block: var(--s5) var(--s4); }
.hello__t {
  margin: 0 0 var(--s2);
  font-family: var(--mono); font-size: clamp(1.5rem, 4.5vw, 2.1rem);
  font-weight: 600; letter-spacing: .02em; color: var(--ink);
}
.hello__tag { margin: 0 0 var(--s3); color: var(--vermilion); font-size: .92rem; }

/* 名乗りの下の写真。幅いっぱいには広げない ── 見出しの一部ではなく、
   本人が撮った1枚として置きたいので、本文と同じくらいの幅で止める。 */
.shot { margin: var(--s3) 0 var(--s4); max-width: 30rem; }
.shot__i {
  display: block; width: 100%; height: auto;
  border: 1px solid var(--rule);
  background: var(--sheet);       /* 読み込み前に穴が空かないように */
}
.shot__c {
  margin-top: var(--s1);
  font-family: var(--mono); font-size: .72rem;
  letter-spacing: .08em; color: var(--ink-mute);
}
.hello__b p { max-width: 44rem; margin: 0 0 var(--s2); line-height: 1.95; color: var(--ink-mid); }

/* まだ書いていない・まだ取っていない、と正直に出す枠 */
.blank {
  margin: 0; padding: var(--s3) var(--s4);
  border: 1px dashed var(--rule); color: var(--ink-mute);
  font-size: .84rem;
}

/* -------------------------------------------------------- 職務経歴 */
.cv { display: grid; gap: 1px; }
.cv__row {
  display: grid; grid-template-columns: minmax(0, 9rem) 1fr;
  gap: var(--s2) var(--s4); padding: var(--s3) 0;
  border-top: 1px solid var(--rule);
}
.cv__row:last-child { border-bottom: 1px solid var(--rule); }
.cv__when { font-size: .8rem; color: var(--ink-mute); white-space: nowrap; }
.cv__dash { padding-inline: .4em; opacity: .6; }
.cv__org { margin: 0 0 .2rem; font-size: .96rem; font-weight: 600; color: var(--ink); }
.cv__role { margin: 0 0 var(--s2); font-size: .84rem; color: var(--vermilion); }
.cv__b { margin: 0; font-size: .86rem; line-height: 1.85; color: var(--ink-mid); }
@media (max-width: 34rem) { .cv__row { grid-template-columns: 1fr; } }

.links { display: flex; flex-wrap: wrap; gap: var(--s3); margin-top: var(--s3); }
.links__a { font-family: var(--mono); font-size: .84rem; color: var(--ink-mid);
  text-decoration-color: var(--rule); text-underline-offset: .2em; }
.links__a:hover { color: var(--vermilion); }
.tags { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0; }

/* -------------------------------------------------------- 研究業績 */
/* 職務経歴と同じ組み。左に種別、右に題目。押せるものだけ下線が付く */
.rsc { margin-bottom: var(--s5); }
.rsc:last-child { margin-bottom: 0; }
.rsc__gt {
  margin: 0 0 var(--s2); font-size: .8rem; font-weight: 600;
  letter-spacing: .1em; color: var(--ink-mute);
}
.rsc__row {
  display: grid; grid-template-columns: minmax(0, 9rem) 1fr;
  gap: var(--s2) var(--s4); padding: var(--s3) 0;
  border-top: 1px solid var(--rule);
}
.rsc__row:last-child { border-bottom: 1px solid var(--rule); }
.rsc__k { line-height: 1.5; }
.rsc__t {
  margin: 0; font-size: .92rem; line-height: 1.7;
  font-weight: 600; color: var(--ink);
}
.rsc__t--go {
  display: inline-block; color: var(--indigo);
  text-decoration-color: var(--rule); text-underline-offset: .2em;
}
.rsc__t--go:hover { color: var(--vermilion); }
.rsc__n {
  margin: .3rem 0 0; font-family: var(--mono);
  font-size: .76rem; color: var(--ink-mute);
}
@media (max-width: 34rem) { .rsc__row { grid-template-columns: 1fr; } }

/* ---------------------------------------------------- マクロ経済指標 */
.gauge { padding: var(--s4) 0; border-top: 1px solid var(--rule); }
.gauge:last-child { border-bottom: 1px solid var(--rule); }
.gauge__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s2); }
.gauge__t { margin: 0; font-size: 1rem; font-weight: 600; color: var(--ink); }
.gauge__sub { font-size: .8rem; color: var(--ink-mute); }
.gauge__why { max-width: 44rem; margin: var(--s2) 0 var(--s3);
  font-size: .86rem; line-height: 1.85; color: var(--ink-mid); }
.gauge__fig { overflow-x: auto; }
.gauge__src { margin: var(--s2) 0 0; font-family: var(--mono);
  font-size: .72rem; color: var(--ink-mute); }
.spark { display: block; width: 100%; min-width: 22rem; height: auto; color: var(--ink); }

/* 掲載元。図より先に置く ── 数字より、どこが出しているかのほうが先に要る */
.srcs { margin: 0 0 var(--s3); }
.srcs__k {
  display: block; margin-bottom: .4rem;
  font-family: var(--mono); font-size: .7rem; letter-spacing: .1em;
  color: var(--ink-mute);
}
.srcs__l { display: flex; flex-wrap: wrap; gap: .35rem; }
.srcs__a {
  display: inline-flex; align-items: center; gap: .35rem;
  padding: .3rem .7rem;
  border: 1px solid var(--rule);
  font-size: .8rem; color: var(--ink-mid); text-decoration: none;
  transition: color .15s, border-color .15s;
}
.srcs__a:hover { color: var(--indigo); border-color: var(--indigo); }
.srcs__go { font-size: .7rem; opacity: .6; }
/* PDF は押すと落ちてくる。押す前に分かるようにしておく */
.srcs__pdf {
  font-family: var(--mono); font-size: .6rem; letter-spacing: .08em;
  padding: .05rem .3rem;
  border: 1px solid currentColor; color: var(--indigo); opacity: .85;
}
/* 図を持たない項目。空欄とは意味が違うので、点線の枠にはしない */
.gauge__only { margin: 0; font-size: .82rem; color: var(--ink-mute); }

/* 一覧表。狭い画面では横に流す（畳んで読めなくするより、流したほうがいい） */
.grid__wrap { overflow-x: auto; margin-bottom: var(--s2); }
.grid { border-collapse: collapse; width: 100%; min-width: 44rem; font-size: .84rem; }
.grid th, .grid td {
  text-align: left; vertical-align: top;
  padding: .55rem .7rem;
  border-bottom: 1px solid var(--rule);
}
.grid th {
  font-family: var(--mono); font-size: .68rem; letter-spacing: .12em;
  font-weight: 400; color: var(--ink-mute); white-space: nowrap;
  border-bottom: 1px solid var(--ink-mute);
}
.grid tbody tr:hover { background: color-mix(in srgb, var(--ink) 3%, transparent); }
.grid__n a { color: var(--ink); text-decoration-color: var(--rule); text-underline-offset: .2em; }
.grid__n a:hover { color: var(--vermilion); }
.grid__by { color: var(--ink-mute); font-size: .78rem; }
.grid__a {
  display: inline-flex; align-items: center; gap: .3rem;
  color: var(--indigo); text-decoration-color: var(--rule); text-underline-offset: .2em;
}
.grid__more { margin-left: .4rem; font-size: .72rem; color: var(--ink-mute); }
.grid__v, .grid__r { white-space: nowrap; }
.grid__num { color: var(--vermilion); font-weight: 600; }
.grid__date { color: var(--ink-mid); }
.grid__when { display: block; font-size: .7rem; color: var(--ink-mute); font-family: var(--serif); }

/* 次回公表の近さ。--heat は 1（いちばん近い）から 0 へ、JS が入れる。
   色は朱を敷くだけにして、濃さだけで順を出す。地の色は敷かず重ねるので、
   白でも黒でも同じ見え方になる。日次で出るものと、過ぎた日付には付かない。 */
.grid__r { position: relative; }
.grid__r::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--vermilion);
  opacity: calc(var(--heat, 0) * .16);
  pointer-events: none;
}
.grid__r > * { position: relative; }          /* 字は敷いた色の上に */
.grid__r.is-next .grid__date {                /* いちばん近い1つだけ朱で書く */
  color: var(--vermilion); font-weight: 600;
}
.grid__r.is-dry .grid__date { color: var(--ink-mute); font-style: italic; }
.grid__warn {
  margin: calc(-1 * var(--s3)) 0 var(--s5);
  padding: var(--s2) var(--s3);
  border-left: 2px solid var(--vermilion);
  font-size: .74rem; color: var(--ink-mid);
}
@media (prefers-contrast: more) {
  .grid__r::before { opacity: calc(var(--heat, 0) * .28); }
}
.grid__dash { color: var(--ink-mute); }
.grid__foot { margin: 0 0 var(--s5); font-size: .72rem; color: var(--ink-mute); }
.grid__last { display: block; font-size: .68rem; color: var(--ink-mute); font-family: var(--serif); opacity: .85; }
</style>
</head>
<body>

<header class="masthead" id="head"></header>

<main>
<section class="sheet">
  <div class="band">
    <h2 class="band__t" data-en="Board games">盤上の自主研究</h2>
    <span class="band__n"></span>
    <span class="tag" id="games-count"></span>
  </div>
  <p class="lead" data-en="I like board games, so I rebuilt three of them to run in a browser and spent rather longer building their opponents. What follows is mostly a record of that. If you want a game, the CPU will play you — it is not there to lose politely.">
    ボードゲームが好きなので、3作をブラウザで動くように書き直し、
    そのあと相手のCPUのほうに長く時間を使いました。以下はおおむねその記録です。
    遊びたい方は、そのまま対戦できます。相手は手加減しません。
  </p>
  <div class="works" id="works"></div>
</section>

<section class="sheet">
  <div class="band">
    <h2 class="band__t band__t--sub" data-en="What I want to try next">次に試したいこと</h2>
    <span class="band__n"></span>
  </div>
  <p class="lead" data-en="The opponent I actually want is not the strongest one — it is the one that has watched me play. Four steps. <strong>None of it is built</strong>; this is a note to myself.">
    ほしいのは最強の相手ではなく、<strong>自分の打ち方を見てきた相手</strong>です。順に4段階。
    <strong>まだどれも実装していません</strong>。自分用の覚え書きです。
  </p>
  <div id="plan"></div>

<script>
/* ==========================================================================
   PLAYBENCH ─ アクセス解析（Google アナリティクス 4）

   何をするか:
     assets/config.js に測定ID（G- で始まる）が入っていれば gtag.js を読み込む。
     入っていなければ何もしない。外部への通信も1本も起きない。

   止め方（3つとも実際に効く）:
     1. ブラウザが追跡拒否を出していれば、最初から読み込まない
        （Global Privacy Control、または DNT）
     2. 奥付の「止める」を押すと localStorage に残り、以後は読み込まない
     3. すでに読み込んだ後でも ga-disable-<測定ID> を立てるので、その場で送信が止まる
        （GA が公式に用意している逃げ道）

   なぜ1ファイルに切り出すか:
     このサイトは外部から何も読み込まない作りで来た。GA はその唯一の例外なので、
     どこへ何を出しているかが1ファイルを読めば分かるようにしておく。
     読みに行く先は https://www.googletagmanager.com/gtag/js だけ。

   立ち上げ手順は docs/analytics.md を参照。
   ========================================================================== */
'use strict';

(function () {
  var PB = window.PB = window.PB || {};
  var cfg = (PB.CONFIG && PB.CONFIG.analytics) || {};
  var id = String(cfg.measurementId || '').trim();
  var KEY = 'pb-analytics';

  function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function keep(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }

  /* ブラウザからの拒否表明。DNT は仕様としては廃れたが、
     いま出している人は明確に「やめてほしい」と言っている。 */
  function refused() {
    if (navigator.globalPrivacyControl) return true;
    var d = navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack;
    return d === '1' || d === 'yes';
  }

  /*  unset … 測定IDが無い（何もしない）
      dnt   … ブラウザが拒否を出している
      off   … 本人が止めた
      on    … 計測する                                        */
  function decide() {
    if (!id) return 'unset';
    var s = saved();
    if (s === 'off') return 'off';
    if (s === 'on') return 'on';        // 本人の明示は DNT より優先する
    return refused() ? 'dnt' : 'on';
  }

  var state = decide();
  var loaded = false;
  var subs = [];

  function load() {
    if (loaded) return;
    loaded = true;

    window.dataLayer = window.dataLayer || [];
    window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
    window.gtag('js', new Date());
    /* GA4 は IP を既定で丸める。効かない設定を足して「やっている風」にしない */
    window.gtag('config', id);

    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(id);
    document.head.appendChild(s);
  }

  function halt(off) { if (id) window['ga-disable-' + id] = !!off; }

  PB.analytics = {
    id: id,
    configured: !!id,
    state: function () { return state; },
    /* 本人の指示。true で許す、false で止める。押した結果を返す */
    set: function (want) {
      if (!id) return state;
      keep(want ? 'on' : 'off');
      state = want ? 'on' : 'off';
      halt(!want);
      if (want) load();
      subs.forEach(function (f) { try { f(state); } catch (e) {} });
      return state;
    },
    onChange: function (f) { subs.push(f); }
  };

  halt(state !== 'on');
  if (state === 'on') load();
})();
</script>

    /* 中央2エリア。水平線で上下に割れている */
    sh(s, 'path', {
      d: 'M' + (cx - r) + ' ' + cy + ' A' + r + ' ' + r + ' 0 0 1 ' + (cx + r) + ' ' + cy + ' Z',
      fill: ink, 'fill-opacity': .17, stroke: ink, 'stroke-width': .55, 'stroke-opacity': .75
    });
    sh(s, 'path', {
      d: 'M' + (cx + r) + ' ' + cy + ' A' + r + ' ' + r + ' 0 0 1 ' + (cx - r) + ' ' + cy + ' Z',
      fill: ink, 'fill-opacity': .09, stroke: ink, 'stroke-width': .55, 'stroke-opacity': .75
    });
    /* 着陸した宇宙飛行士。多数派を争っている区画にだけ置く */
    [[28, 30], [33, 30], [62, 33], [67, 33], [71.5, 33], [45.5, 44], [50.5, 44]]
      .forEach(function (p) {
        sh(s, 'circle', { cx: p[0], cy: p[1], r: 2, fill: ink, 'fill-opacity': .55 });
      });
    /* 衛星フォボス。どのエリアにも隣接しない */
    sh(s, 'circle', {
      cx: 88, cy: 12, r: 8,
      fill: ink, 'fill-opacity': .1, stroke: ink, 'stroke-width': .5, 'stroke-opacity': .6
    });
    sh(s, 'circle', { cx: 88, cy: 12, r: 2, fill: ink, 'fill-opacity': .5 });
    return s;
  }

  var FIGS = {
    blocks: figBlocks, grid: figGrid, cards: figCards, rondel: figRondel, mars: figMars
  };

  /* ------------------------------------------------------------ BGG */
  /* 他人が付けた数字。こちらの実測とは別物なので、色も置き場所も分ける。
     data/bgg.js が無い、あるいはその作品の項が無ければ、黙って何も出さない。 */
  function bggRow(w) {
    var all = PB.BGG;
    if (!all || !all.games) return null;
    var g = all.games[w.id];
    if (!g || (g.weight == null && g.rating == null)) return null;

    var box = el('div', 'bgg');
    box.appendChild(el('span', 'bgg__k', 'BGG'));

    function meter(label, v, max) {
      if (v == null) return;
      var unit = el('div', 'bgg__m');
      unit.appendChild(el('span', 'bgg__ml', label));
      var track = el('div', 'bgg__t');
      var bar = el('div', 'bgg__b');
      bar.style.width = (v / max * 100) + '%';
      track.appendChild(bar);
      unit.appendChild(track);
      unit.appendChild(el('span', 'bgg__v num', v.toFixed(2) + ' / ' + max));
      box.appendChild(unit);
    }
    meter(lang === 'en' ? 'Weight' : '重さ', g.weight, 5);
    meter(lang === 'en' ? 'Rating' : '評価', g.rating, 10);

    var tail = el('div', 'bgg__tail');
    if (g.ratings) {
      tail.appendChild(el('span', 'bgg__n num',
        g.ratings.toLocaleString(lang === 'en' ? 'en' : 'ja') +
        (lang === 'en' ? ' ratings' : '人が評価')));
    }
    var a = el('a', 'bgg__a', (lang === 'en' ? 'on BGG' : 'BGG で見る') + ' \u2197');
    a.href = 'https://boardgamegeek.com/boardgame/' + g.id;
    a.rel = 'noopener';
    a.target = '_blank';
    tail.appendChild(a);
    if (all.fetchedAt) {
      tail.appendChild(el('span', 'bgg__d num',
        (lang === 'en' ? 'as of ' : '') + all.fetchedAt + (lang === 'en' ? '' : ' 時点')));
    }
    box.appendChild(tail);
    return box;
  }

  /* アバター。ハンドル名から決まる、左右対称の升目模様 */
  /* ------------------------------------------------------- 実測プレート */
  function buildPlate(p) {
    var fig = el('figure', 'plate');

    var cap = el('figcaption', 'cell__k');
    cap.appendChild(el('span', 'tag tag--ink', t('plate') + ' ── ' + pick(p, 'caption')));
    cap.appendChild(el('span', 'plate__note', pick(p, 'note')));
    fig.appendChild(cap);

    var baseV = p.baseline == null ? .25 : p.baseline;
    var scale = el('div', 'scale');
    scale.style.setProperty('--base', baseV);

    p.rows.forEach(function (r) {
      var row = el('div', 'srow' + (r.lead ? ' srow--lead' : ''));
      row.appendChild(el('div', 'srow__l', pick(r, 'label')));
      var track = el('div', 'srow__track');
      var bar = el('div', 'srow__bar');
      bar.style.setProperty('--v', r.v);
      track.appendChild(bar);

      /* 信頼区間があれば棒の先にひげを立てる。
         その棒がどれだけ揺れうるかは、値そのものと同じだけ意味がある。 */
      if (r.ci) {
        var lo = Math.max(0, r.v - r.ci), hi = Math.min(1, r.v + r.ci);
        var err = el('div', 'srow__err');
        err.style.left = lo * 100 + '%';
        err.style.width = (hi - lo) * 100 + '%';
        err.title = fmt(r.v) + ' \u00b1' + fmt(r.ci);
        track.appendChild(err);
      }
      row.appendChild(track);

      var val = el('div', 'srow__v', fmt(r.v));
      if (r.ci) val.appendChild(el('span', 'srow__ci', '\u00b1' + fmt(r.ci)));
      row.appendChild(val);
      scale.appendChild(row);
    });

    var axis = el('div', 'axis');
    var at = el('div', 'axis__t');
    [
      { at: 0, label: '0', cls: '' },
      { at: baseV * 100, label: t('parity') + ' ' + fmt(baseV), cls: ' axis__tick--base' },
      { at: 100, label: '1.000', cls: ' axis__tick--end' }
    ].forEach(function (k) {
      var tick = el('span', 'axis__tick' + k.cls, k.label);
      tick.style.left = k.at + '%';
      at.appendChild(tick);
    });
    axis.appendChild(at);
    scale.appendChild(axis);
    scale.appendChild(el('div', 'scale__base'));

    fig.appendChild(scale);
    return fig;
  }

  /* 一行版。カードの表に出す「相手の強さ」 */
  function strengthChip(w) {
    var p = w.plate, baseV = p.baseline == null ? .25 : p.baseline;
    var row = null;
    p.rows.forEach(function (r) { if (r.lead && !row) row = r; });
    if (!row) row = p.rows[0];

    var chip = el('div', 'chip');
    chip.appendChild(el('span', 'chip__k', t('strength')));

    var track = el('div', 'chip__track');
    track.style.setProperty('--base', baseV * 100 + '%');
    var bar = el('div', 'chip__bar');
    bar.style.setProperty('--v', row.v);
    track.appendChild(bar);
    chip.appendChild(track);

    chip.appendChild(el('span', 'chip__v num', fmt(row.v)));
    chip.appendChild(el('span', 'chip__n', pick(row, 'label')));
    return chip;
  }

  function buildGame(w) {

    var head = el('div', 'game__head');

    head.appendChild(el('h3', 'game__title', pick(w, 'title')));

    var meta = el('p', 'game__meta');
    [pick(w, 'players'), pick(w, 'genre'), pick(w, 'designer')].forEach(function (m, i) {
      if (i) meta.appendChild(el('span', 'game__dot', '·'));
      meta.appendChild(el('span', null, m));
    });
    head.appendChild(meta);

    head.appendChild(el('p', 'game__hook', pick(w, 'hook')));
    var bgg = bggRow(w);
    if (bgg) head.appendChild(bgg);
    head.appendChild(strengthChip(w));

    var acts = el('div', 'game__acts');
    if (w.play) {
      var a = el('a', 'btn btn--go', '▶ ' + t('play'));
      a.href = w.play;
      acts.appendChild(a);
    } else {
      var off = el('span', 'btn btn--off', t('soon'));
      off.title = pick(w, 'playNote') || '';
      acts.appendChild(off);
    }
    var rp = el('a', 'btn', t('repo'));
    rp.href = w.repo; rp.rel = 'noopener';
    acts.appendChild(rp);

    var opp = el('span', 'game__opp');
    opp.appendChild(el('b', null, t('opponent')));
    opp.appendChild(el('span', null, pick(w, 'opponents')));
    acts.appendChild(opp);

    head.appendChild(acts);
    top.appendChild(head);
    art.appendChild(top);

    /* ── 裏：作りの話。畳んでおく ── */
    var det = el('details', 'game__more');
    var sum = el('summary', 'game__sum', t('detail'));
    det.appendChild(sum);

    var body = el('div', 'game__body cells');
    var c1 = el('div', 'cell');
    c1.appendChild(el('h4', 'cell__t', pick(w, 'method')));
    c1.appendChild(el('p', 'cell__p', pick(w, 'methodBody')));
    if (w.remark) {

    var c2 = el('div', 'cell');

    det.appendChild(body);
    det.addEventListener('toggle', function () {

  function buildWire() {
    var box = el('div', 'wire');
    var s = svg(640, 132);
    s.setAttribute('aria-label', lang === 'en'
      ? 'Agents arrive as pull requests, run in CI, and results are committed back as JSON.'
      : 'エージェントはPRで届き、CIで対戦し、結果はJSONとしてコミットされる。');
    var ink = 'currentColor';
    var boxes = lang === 'en'
      ? ['Agent (JS)', 'Pull request', 'GitHub Actions\nseeded matches', 'results.json\ncommitted', 'This page']
      : ['エージェント\n(JS 1ファイル)', 'Pull Request', 'GitHub Actions\nシード固定で対戦', 'results.json\nをコミット', 'このページ'];

    var w = 108, h = 54, gap = 25, y = 22;
    boxes.forEach(function (label, i) {
      var x = i * (w + gap) + 6, accent = (i === 2);
      sh(s, 'rect', { x: x, y: y, width: w, height: h,
        fill: ink, 'fill-opacity': accent ? .07 : .03,
        stroke: ink, 'stroke-width': accent ? 1.1 : .8, 'stroke-opacity': accent ? .7 : .45 });
      label.split('\n').forEach(function (line, li, arr) {
        var tx = sh(s, 'text', {
          x: x + w / 2, y: y + h / 2 + (li - (arr.length - 1) / 2) * 13 + 4,
          'text-anchor': 'middle', fill: ink,
          'font-size': arr.length > 1 ? 10 : 11, 'fill-opacity': li === 0 ? .85 : .6 });
        tx.textContent = line;
      });
      if (i < boxes.length - 1) {
        var ax = x + w + 4;
        sh(s, 'line', { x1: ax, y1: y + h / 2, x2: ax + gap - 8, y2: y + h / 2, stroke: ink, 'stroke-width': .8, 'stroke-opacity': .5 });
        sh(s, 'path', { d: 'M' + (ax + gap - 8) + ' ' + (y + h / 2) + ' l-4 -3 v6 z', fill: ink, 'fill-opacity': .5 });
      }
    });
    var cap = sh(s, 'text', { x: 6, y: 116, fill: ink, 'font-size': 10, 'fill-opacity': .55 });
    cap.textContent = lang === 'en'
      ? 'No server. Every row can be reproduced from its seed and its run log.'
      : 'サーバーを持たない。順位表のどの行も、シードと実行ログから再現できる。';
    box.appendChild(s);
    return box;
  }

  /* ------------------------------------------------------------- 棒の伸び */
  var io = null;
  function watchPlates(root) {
    var nodes = root.querySelectorAll('.scale:not(.is-read)');
    if (!('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(nodes, function (n) { n.classList.add('is-read'); });
      return;
    }
    if (!io) {
      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('is-read'); io.unobserve(e.target); }
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: .15 });
    }
    Array.prototype.forEach.call(nodes, function (n) { io.observe(n); });
  }

        var body = el('div', 'cv__body');
        body.appendChild(el('h3', 'cv__org', pick(r, 'org')));
        if (r.role) body.appendChild(el('p', 'cv__role', pick(r, 'role')));
        if (r.body) body.appendChild(el('p', 'cv__b', pick(r, 'body')));
        row.appendChild(body);
        list.appendChild(row);
      });
      car.appendChild(list);
    } else car.appendChild(notYet());

    /* ---- 研究業績 */
    var rs = document.getElementById('profile-research');
    if (!rs) return;
    rs.textContent = '';
    if (pr.research && pr.research.fill && pr.research.groups.length) {
      pr.research.groups.forEach(function (grp) {
        var g = el('section', 'rsc');
        g.appendChild(el('h3', 'rsc__gt', pick(grp, 'label')));
        grp.rows.forEach(function (r) {
          var row = el('div', 'rsc__row');

          var k = el('div', 'rsc__k');
          k.appendChild(el('span', 'tag tag--ink', pick(r, 'kind')));
          row.appendChild(k);

          var b = el('div', 'rsc__b');
          /* url があるときだけリンクにする。無いものは文字のまま置く */
          if (r.url) {
            var a = el('a', 'rsc__t rsc__t--go', pick(r, 'title'));
            a.href = r.url; a.rel = 'noopener';
            b.appendChild(a);
          } else {
            b.appendChild(el('p', 'rsc__t', pick(r, 'title')));
          }
          var note = pick(r, 'note');
          if (note) b.appendChild(el('p', 'rsc__n', note));
          row.appendChild(b);

          g.appendChild(row);
        });
        rs.appendChild(g);
      });
    } else rs.appendChild(notYet());
  }


  /* ═════════════════════════════════════════════════════ マクロ経済指標 */
  /* 月次の系列を折れ線で。外部ライブラリは使わず、その場で SVG を作る。 */
  function sparkline(series, unit) {
    var v = series.v.filter(function (x) { return x != null; });
    if (v.length < 2) return null;

    var W = 640, H = 150, PADL = 34, PADR = 44, PADB = 18, PADT = 8;
    var lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);
    if (hi === lo) { hi += 1; lo -= 1; }
    var pad = (hi - lo) * .08; hi += pad; lo -= pad;

    var n = series.v.length;
    var x = function (i) { return PADL + (W - PADL - PADR) * (n === 1 ? 0 : i / (n - 1)); };
    var y = function (val) { return PADT + (H - PADT - PADB) * (1 - (val - lo) / (hi - lo)); };

    var s = svg(W, H), ink = 'currentColor';
    s.setAttribute('class', 'spark');

    /* 目盛は上下2本だけ。図面の罫のつもりで薄く */
    [hi - pad, lo + pad].forEach(function (val) {
      sh(s, 'line', { x1: PADL, y1: y(val), x2: W - PADR, y2: y(val),
        stroke: ink, 'stroke-width': .5, 'stroke-opacity': .25, 'stroke-dasharray': '3 3' });
      var tx = sh(s, 'text', { x: PADL - 5, y: y(val) + 3.5, 'text-anchor': 'end',
        fill: ink, 'font-size': 9, 'fill-opacity': .55 });
      tx.textContent = val.toFixed(1);
    });

    var d = '', started = false;
    series.v.forEach(function (val, i) {
      if (val == null) { started = false; return; }      // 欠測はつながない
      d += (started ? ' L' : ' M') + x(i).toFixed(1) + ' ' + y(val).toFixed(1);
      started = true;
    });
    sh(s, 'path', { d: d.trim(), fill: 'none', stroke: ink, 'stroke-width': 1.2,
      'stroke-opacity': .75, 'stroke-linejoin': 'round' });

    /* 直近の値を朱で置く。ここだけが「いまの数字」 */
    var lastI = -1;
    for (var i = series.v.length - 1; i >= 0; i--) if (series.v[i] != null) { lastI = i; break; }
    if (lastI >= 0) {
      var lv = series.v[lastI];
      sh(s, 'circle', { cx: x(lastI), cy: y(lv), r: 2.6, fill: 'var(--vermilion)' });
      var lab = sh(s, 'text', { x: Math.min(x(lastI) + 6, W - 4), y: y(lv) + 3.5,
        fill: 'var(--vermilion)', 'font-size': 11, 'font-weight': 600 });
      lab.textContent = lv.toFixed(2) + (unit || '');
    }

    /* 横軸は端の年だけ。細かい目盛は要らない */
    [[0, series.from], [n - 1, monthAt(series.from, n - 1)]].forEach(function (p, k) {
      var tx = sh(s, 'text', { x: k === 0 ? PADL : W - PADR, y: H - 4,
        'text-anchor': k === 0 ? 'start' : 'end', fill: ink, 'font-size': 9, 'fill-opacity': .55 });
      tx.textContent = p[1];
    });
    return s;
  }

  function monthAt(from, k) {
    var a = from.split('-'), m = (+a[1] - 1) + k;
    return (+a[0] + Math.floor(m / 12)) + '-' + String(m % 12 + 1).padStart(2, '0');
  }

  /* 見ている人の「今日」。UTC ではなく手元の暦で取る。
     公表日は YYYY-MM-DD なので、同じ形にして文字列のまま比べられる。 */
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  /* その指標の「次の公表」。data/releases.js に入っている予定のうち、
     今日以降で最初の1件。過ぎたものは自動的に飛ばされるので、
     予定が残っているかぎり、日付が変わるだけで次に繰り上がる。
     見つからなければ null（＝予定が尽きている）。 */
  function nextRelease(ind, now) {
    if (!ind.release || ind.release.daily) return null;
    var rows = (PB.RELEASES && PB.RELEASES.byId && PB.RELEASES.byId[ind.id]) || [];
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].on >= now) return rows[i];
    }
    return null;
  }

  /* 次回公表の近さを返す（1 がいちばん近い）。
     ─ 日次で出るもの（daily）は持たない。「次の1日」が無いので。
     ─ 予定が尽きているものも持たない。無いものは無いと出す。

     濃さは日数の差ではなく順位で決める。公表が固まる月半ばでも、
     間があく月末でも、同じ幅で読めるように。
     順位は日付ごとに振る。同じ日に出るものは同じ濃さにしたい。
     いちばん遠いものも薄く残す。0 にすると、上の2つ（対象外）と
     見分けがつかなくなるので。 */
  var HEAT_FAINT = .15;

  function releaseHeat(inds) {
    var now = today();
    var next = {}, days = [];

    inds.forEach(function (ind) {
      var r = nextRelease(ind, now);
      if (!r) return;
      next[ind.id] = r;
      if (days.indexOf(r.on) < 0) days.push(r.on);
    });
    days.sort();

    var heat = {};
    Object.keys(next).forEach(function (id) {
      var k = days.indexOf(next[id].on);
      var far = days.length < 2 ? 0 : k / (days.length - 1);   /* 0=近い 1=遠い */
      heat[id] = 1 - far * (1 - HEAT_FAINT);
    });
    return { heat: heat, next: next, now: now, first: days[0] || '', days: days.length };
  }

  /* 一覧表。下のカードと同じ中身だが、横に並べたほうが一望できる。
     何を見ているか・どこが出しているか・いつ出るか、を1行で。 */
  function buildMacroTable() {
    var host = document.getElementById('macro-table');
    if (!host || !PB.INDICATORS) return;
    host.textContent = '';
    var en = lang === 'en';
    var M = PB.MACRO || { series: {} };

    var tbl = el('table', 'grid');
    var head = el('tr');
    [en ? 'Indicator' : '項目', en ? 'Published by' : '出典元',
     en ? 'Source' : 'リンク', en ? 'Latest data' : '直近データ',
     en ? 'Next release' : '次回公表'].forEach(function (h) {
      head.appendChild(el('th', null, h));
    });
    var thead = el('thead'); thead.appendChild(head); tbl.appendChild(thead);

    var hot = releaseHeat(PB.INDICATORS);

    var body = el('tbody');
    PB.INDICATORS.forEach(function (ind) {
      var tr = el('tr');

      /* 項目 ── 下のカードへ飛ばす */
      var name = el('td', 'grid__n');
      var jump = el('a', null, pick(ind, 'title'));
      jump.href = '#g-' + ind.id;
      name.appendChild(jump);
      tr.appendChild(name);

      tr.appendChild(el('td', 'grid__by', pick(ind, 'by')));

      /* リンク ── 1本目だけ表に出す。残りはカードに全部ある */
      var link = el('td');
      if (ind.sources && ind.sources.length) {
        var s0 = ind.sources[0];
        var a = el('a', 'grid__a', pick(s0, 'label'));
        a.href = s0.url; a.rel = 'noopener'; a.target = '_blank';
        if (s0.pdf) a.appendChild(el('span', 'srcs__pdf', 'PDF'));
        link.appendChild(a);
        if (ind.sources.length > 1) {
          link.appendChild(el('span', 'grid__more',
            en ? '+' + (ind.sources.length - 1) : '他' + (ind.sources.length - 1)));
        }
      }
      tr.appendChild(link);

      /* 直近データ ── 系列を持っているものだけ。持たないものは「—」 */
      var ser = M.series && M.series[ind.id];
      var val = el('td', 'grid__v num');
      if (ser && ser.v.length) {
        var lastI = ser.v.length - 1;
        while (lastI >= 0 && ser.v[lastI] == null) lastI--;
        if (lastI >= 0) {
          val.appendChild(el('span', 'grid__num',
            ser.v[lastI].toFixed(2) + (ind.unit || '')));
          val.appendChild(el('span', 'grid__when', monthAt(ser.from, lastI)));
        }
      } else {
        val.appendChild(el('span', 'grid__dash', '—'));
      }
      tr.appendChild(val);

      /* 次回公表。近いものほど地を濃くする。濃さは CSS 変数で渡して、
         色そのものは CSS 側（＝テーマ）に決めさせる。 */
      var r = ind.release || {};
      var nx = hot.next[ind.id];
      var when = el('td', 'grid__r');
      var h = hot.heat[ind.id];
      if (h != null) {
        when.style.setProperty('--heat', h.toFixed(3));
        /* 同じ日に出るものが複数あれば、その全部に印を付ける */
        if (nx.on === hot.first) when.classList.add('is-next');
      }

      if (r.daily) {
        when.appendChild(el('span', 'grid__date num', pick(r, 'note') || (en ? 'daily' : '毎営業日')));
      } else if (nx) {
        when.appendChild(el('span', 'grid__date num', nx.on));
        if (nx.note) when.appendChild(el('span', 'grid__when', nx.note));
      } else {
        /* 予定が尽きている。無いものは無いと書く。空欄や古い日付でごまかさない */
        when.classList.add('is-dry');
        when.appendChild(el('span', 'grid__date', en ? 'not fetched' : '予定なし'));
        when.appendChild(el('span', 'grid__when', en
          ? 'nothing left in the calendar' : 'カレンダーに先の予定がありません'));
      }
      tr.appendChild(when);

      body.appendChild(tr);
    });
    tbl.appendChild(body);

    var wrap = el('div', 'grid__wrap');
    wrap.appendChild(tbl);
    host.appendChild(wrap);

    /* 脚注。書いてあることが実際と合っている状態を保つ。
       予定が尽きかけているときは、そう言う。黙って色が消えるのがいちばん困る。 */
    var R = PB.RELEASES || {};
    var foot = el('p', 'grid__foot', en
      ? 'Release dates come from my own calendar, read again every day. Last read '
        + (R.asOf || '?') + '.'
      : '公表予定は自分のカレンダーから毎日読み直しています（最後に読んだのは '
        + (R.asOf || '?') + '）。');
    host.appendChild(foot);

    var dry = PB.INDICATORS.filter(function (i) {
      return !(i.release && i.release.daily) && !hot.next[i.id];
    }).length;
    if (dry) {
      host.appendChild(el('p', 'grid__warn', en
        ? dry + ' of these have no future date left in the calendar. '
          + 'Add the next ones there, or the ordering above goes blank.'
        : 'このうち ' + dry + ' 件は、カレンダーに先の予定が残っていません。'
          + 'カレンダー側に足さないと、上の色の順序が出せなくなります。'));
    }
  }

  function buildMacro() {
    var host = document.getElementById('macro');
    if (!host || !PB.INDICATORS) return;
    host.textContent = '';
    var M = PB.MACRO || { series: {} };

    var when = document.getElementById('macro-when');
    if (when) when.textContent = M.fetched
      ? (lang === 'en' ? 'fetched ' + M.fetched : M.fetched + ' 取得')
      : (lang === 'en' ? 'not fetched' : '未取得');

    PB.INDICATORS.forEach(function (ind) {
      var card = el('section', 'gauge');
      card.id = 'g-' + ind.id;

      var head = el('div', 'gauge__head');
      head.appendChild(el('h3', 'gauge__t', pick(ind, 'title')));
      var sub = pick(ind, 'sub');
      if (sub) head.appendChild(el('span', 'gauge__sub', sub));
      card.appendChild(head);

      card.appendChild(el('p', 'gauge__why', pick(ind, 'why')));

      /* 掲載元は図より先に置く。数字より、どこが出しているかのほうが先に要る。
         PDF は別物として印を付ける（開くと落ちてくるので、押す前に分かるように）。 */
      if (ind.sources && ind.sources.length) {
        var box = el('div', 'srcs');
        box.appendChild(el('span', 'srcs__k',
          (lang === 'en' ? 'Published by ' : '掲載元 ') + pick(ind, 'by')));
        var list = el('div', 'srcs__l');
        ind.sources.forEach(function (src) {
          var a = el('a', 'srcs__a' + (src.pdf ? ' srcs__a--pdf' : ''), pick(src, 'label'));
          a.href = src.url;
          a.rel = 'noopener';
          a.target = '_blank';
          if (src.pdf) a.appendChild(el('span', 'srcs__pdf', 'PDF'));
          else a.appendChild(el('span', 'srcs__go', '↗'));
          list.appendChild(a);
        });
        box.appendChild(list);
        card.appendChild(box);
      }

      var s = M.series && M.series[ind.id];
      if (s && s.v && s.v.length) {
        var fig = el('div', 'gauge__fig');
        var g = sparkline(s, ind.unit);
        if (g) fig.appendChild(g);
        card.appendChild(fig);
        card.appendChild(el('p', 'gauge__src', (lang === 'en'
          ? 'Monthly, ' + s.from + ' to ' + monthAt(s.from, s.v.length - 1) + ' · ' + (M.source || '')
          : '月次 ' + s.from + ' 〜 ' + monthAt(s.from, s.v.length - 1) + ' ・ 出どころ ' + (M.source || ''))));
      } else if (ind.fn) {
        /* 取ってこられるのに、まだ取っていない */
        card.appendChild(el('p', 'blank', lang === 'en'
          ? 'Not fetched yet. Run tools/fetch-macro.mjs with an API key.'
          : 'まだ取ってきていません。tools/fetch-macro.mjs を鍵つきで走らせると入ります。'));
      } else {
        /* そもそも系列を持たない。掲載元を見に行く項目 */
        card.appendChild(el('p', 'gauge__only', lang === 'en'
          ? 'No series here — this one is read at the source.'
          : 'ここに図はありません。掲載元で読む項目です。'));
      }
      host.appendChild(card);
    });
  }

  /* --------------------------------------------------------------- 描画 */
  function render() {
    buildHead();
    buildFoot();
    buildHello();
    buildProfile();
    buildMacroTable();
    buildMacro();

    var games = document.getElementById('works');
    if (games) {
      games.textContent = '';
      PB.WORKS.forEach(function (w) { games.appendChild(buildGame(w)); });
    }

    var cnt = document.getElementById('games-count');
    if (cnt) cnt.textContent = lang === 'en'
      ? PB.WORKS.length + ' games'
      : '全 ' + PB.WORKS.length + ' 作';

    var plan = document.getElementById('plan');
    if (plan) { plan.textContent = ''; plan.appendChild(buildPlan()); }

    var tenets = document.getElementById('tenets');
    if (tenets) { tenets.textContent = ''; tenets.appendChild(buildTenets()); }

    buildRanking();
    buildPrivacyState();
    watchPlates(document);
  }

  /* ------------------------------------------------------------ 言語切替 */
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en]').forEach(function (n) {
      if (n.dataset.ja == null) n.dataset.ja = n.innerHTML;
      n.innerHTML = lang === 'en' ? n.dataset.en : n.dataset.ja;
    });
    render();          // 天地ごと組み直す。切替ボタンもここで作り直される
    paintControls();   // なので文字を入れるのは render のあと
  }

  /* 天が組み直されるたびに、2つの切替ボタンの見た目を入れ直す。
     狭い画面では「切り替え先」だけを出す（CSS で .ctl__now を隠す）。 */
  function paintControls() {
    var lb = document.getElementById('lang');
    if (lb) {
      lb.textContent = '';
      lb.appendChild(el('span', 'ctl__now ctl__on', lang === 'en' ? 'EN' : '日本語'));
      lb.appendChild(el('span', 'ctl__now', ' / '));
      lb.appendChild(el('span', null, lang === 'en' ? '日本語' : 'EN'));
      lb.setAttribute('aria-label', lang === 'en' ? 'Switch to Japanese' : '英語に切り替える');
    }
    var tb = document.getElementById('theme');
    if (tb) {
      /* 白と黒の2つだけ。押したら何になるかを出す */
      var next = theme() === 'dark' ? 'light' : 'dark';
      var name = lang === 'en'
        ? (next === 'dark' ? 'Dark' : 'Light')
        : (next === 'dark' ? '黒' : '白');
      tb.textContent = '';
      tb.appendChild(el('span', 'ctl__long', name));
      var short = el('span', 'ctl__short', next === 'dark' ? '●' : '○');
      short.setAttribute('aria-hidden', 'true');
      tb.appendChild(short);
      tb.setAttribute('aria-label', lang === 'en'
        ? 'Switch to ' + name.toLowerCase() : name + 'に切り替える');
    }
  }

  /* いまが白か黒か。既定は黒 ── CSS の素の :root が黒なので、
     属性が無いときは黒が出ている。ここもそれに合わせる。
     端末の設定は見ない。見ると答えが CSS とずれる。 */
  function theme() {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }

  /* ------------------------------------------------------------ 明暗切替 */
  function applyTheme(m) {
    if (m) document.documentElement.setAttribute('data-theme', m);
    else document.documentElement.removeAttribute('data-theme');
    try { m ? localStorage.setItem('pb-theme', m) : localStorage.removeItem('pb-theme'); } catch (e) {}
    paintControls();
  }

  /* --------------------------------------------------------------- 起動 */
  function boot() {
    try {
      var saved = localStorage.getItem('pb-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    } catch (e) {}

    applyLang();
    applyTheme(document.documentElement.getAttribute('data-theme'));

    /* 切替ボタンは天と一緒に作り直されるので、要素に直接ではなく
       document で受ける。付け直しの漏れが起きない。 */
    document.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('#lang, #theme') : null;
      if (!b) return;
      if (b.id === 'lang') {
        lang = (lang === 'ja' ? 'en' : 'ja');
        applyLang();
        return;
      }
      applyTheme(theme() === 'dark' ? 'light' : 'dark');
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
