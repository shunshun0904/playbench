name: Refresh BGG data

# 定期実行は付けていない。BGG はデータセンターからの要求を 401 で弾いており、
# GitHub のランナーはまさにそれに当たるため、走らせても必ず失敗する
# （api.geekdo.com / boardgamegeek.com / www. の3宛先 × 名乗り2種、いずれも 401 で実測済み）。
#
# 確実なのは手元で実行して data/bgg.js をコミットすること:
#     npm run bgg && git add data/bgg.js && git commit
#
# 手動実行の口だけ残してある。BGG の方針が変われば、ここから通るようになる。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgg
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: BGG から取ってくる
        run: node tools/fetch-bgg.mjs

      - name: 変化があればコミットする
        run: |
          if git diff --quiet -- data/bgg.js; then
            echo "変化なし。何もしない"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bgg.js
          git commit \
            -m "BGG の重さと評価を更新" \
            -m "出典は boardgamegeek.com。こちらの実測ではなく他人が付けた数字なので、取得日と評価人数を一緒に残している。"
          git push
