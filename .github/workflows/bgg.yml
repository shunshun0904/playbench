name: Refresh BGG data

# 定期実行は付けていない。BGG はデータセンターからの要求を 401 で弾いており、
# GitHub のランナーはまさにそれに当たっていた
# （api.geekdo.com / boardgamegeek.com / www. の3宛先 × 名乗り2種、いずれも 401 で実測済み）。
#
# 2026-08、XML API の利用申請が承認されて鍵が発行された。承認の主眼は
# まさにこの制限の解除のはずなので、ここから通るかを試せるようにしてある。
# 鍵は Secrets（BGG_KEY）。リポジトリには置かない。
#
# 通らなければ、これまでどおり手元で実行して data/bgg.js をコミットする:
#     BGG_KEY=xxxx npm run bgg && git add data/bgg.js && git commit
#
# 定期実行を付けないのは変えていない。申請文で「更新は手動、多くても週1回」と
# 書いているので、勝手に回すのは筋が通らない。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgg
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: BGG から取ってくる
        env:
          # 承認時に発行された鍵。どう送るかは申請の記録に無いので、
          # BGG_KEY_MODE を指定しなければ道具が1回だけ実測して確かめる。
          # 通った送り方が分かったら、ここに BGG_KEY_MODE: bearer などと書けば
          # 試行が起きなくなる（要求数が減る）。
          BGG_KEY: ${{ secrets.BGG_KEY }}
        run: node tools/fetch-bgg.mjs

      - name: 変化があればコミットする
        run: |
          if git diff --quiet -- data/bgg.js; then
            echo "変化なし。何もしない"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bgg.js
          git commit \
            -m "BGG の重さと評価を更新" \
            -m "出典は boardgamegeek.com。こちらの実測ではなく他人が付けた数字なので、取得日と評価人数を一緒に残している。"
          git push
