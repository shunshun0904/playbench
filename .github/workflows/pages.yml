name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配備は1本ずつ。ただし走っているものを殺さない ──
# 途中で切ると、直前の変更が配備されないまま残る（実際に2回そうなった）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # environment: github-pages は宣言しない。
    # aquire も同じ形にしてある（1912eed）。
    #
    # 2026-08-06、これを宣言していたときに6回続けて配備が落ちた
    # （#36 #37 #39 #40 #41 と #40 の再実行）。10分ずっと
    # deployment_queued のままで、一度も動き出さなかった。
    # 外した直後の #42 は5分でキューを抜けて実際に配備が走ったので、
    # 効いた可能性はある。ただし同時に Pages 側も遅かったので、
    # これが原因だったと言い切れる証拠は取れていない。
    #
    # 引き換えに Actions の画面へ配備先URLが出なくなるが、それだけ。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 参照するURLを配備ごとに変える。これが無いと GitHub Pages の
      # max-age=600 のせいで、配備は成功しているのに閲覧者の画面が
      # 古いままになる（ゲームを増やしたときに実際に起きた）。
      - name: アセットの参照に版を打つ
        run: node tools/stamp-assets.mjs "${{ github.sha }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 待ち時間は伸ばせない。deploy-pages@v4 は timeout を内部で
          # 600000ms に丸めるので、900000 と書いても10分で切れる。
          # 上限そのものを書いておく。
          #
          # そして上限に達すると、この action は進行中の配備を
          # 取り消す（"Canceling Pages deployment..."）。つまり
          # Pages 側が遅い日は、あと少しで終わる配備を自分で殺す。
          # #42 は キュー5分 + 配備4分 で上限に届き、そうなった。
          # 落ちたときは、すぐ叩き直さずに時間を置くこと。
          timeout: 600000        # 10分（これが上限。伸ばせない）
          error_count: 20
