name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配備は1本ずつ。ただし走っているものを殺さない ──
# 途中で切ると、直前の変更が配備されないまま残る（実際に2回そうなった）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # environment: github-pages は宣言しない。
    #
    # 宣言すると、その環境の保護ルール（配備を許可するブランチの指定など）が
    # 配備に掛かる。引っかかると Pages 側は配備を受け取ったまま
    # deployment_queued から進まず、10分の上限で打ち切られる。
    # 2026-08-06 に6回続けてそうなった（#36 #37 #39 #40 #41）。
    #
    # 同じことが 2026-07-31 に aquire で起きていて、そちらは
    # 「配備ジョブから environment の宣言を外す」(1912eed) で直っている。
    # 引き換えに Actions の画面へ配備先URLが出なくなるが、それだけ。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 参照するURLを配備ごとに変える。これが無いと GitHub Pages の
      # max-age=600 のせいで、配備は成功しているのに閲覧者の画面が
      # 古いままになる（ゲームを増やしたときに実際に起きた）。
      - name: アセットの参照に版を打つ
        run: node tools/stamp-assets.mjs "${{ github.sha }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 待ち時間は伸ばせない。deploy-pages@v4 は timeout を内部で
          # 600000ms に丸めるので、900000 と書いても10分で切れる。
          # 上限そのものを書いておく。
          timeout: 600000        # 10分（これが上限。伸ばせない）
          error_count: 20
