name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配備は1本ずつ。ただし走っているものを殺さない ──
# 途中で切ると、直前の変更が配備されないまま残る（実際に2回そうなった）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 参照するURLを配備ごとに変える。これが無いと GitHub Pages の
      # max-age=600 のせいで、配備は成功しているのに閲覧者の画面が
      # 古いままになる（ゲームを増やしたときに実際に起きた）。
      - name: アセットの参照に版を打つ
        run: node tools/stamp-assets.mjs "${{ github.sha }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages 側の配備待ちが混むことがある。既定のままだと
          # deployment_queued のまま打ち切られて失敗する（実際に起きた）。
          timeout: 900000        # 15分待つ
          error_count: 20
